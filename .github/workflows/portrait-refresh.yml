name: One-time portrait refresh
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/portrait-refresh.yml
permissions:
  contents: write
jobs:
  refresh-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace portrait
        run: |
          python3 - <<'PY'
          import base64
          import subprocess
          from pathlib import Path

          previous = subprocess.check_output(['git', 'show', 'HEAD^:.github/workflows/portrait-refresh.yml'], text=True)
          block = previous.split('          PORTRAIT_B64: >-\n', 1)[1].split('        run: |', 1)[0]
          encoded = ''.join(block.split())
          base64.b64decode(encoded, validate=True)
          page = Path('index.html')
          html = page.read_text()
          old_start = '<img width="320" height="413" alt="Md. Amber Ali Khandoker in a black suit" src="data:image/avif;base64,'
          old_end = '" alt="">'
          start = html.find(old_start)
          assert start >= 0, 'Existing portrait markup not found'
          end = html.find(old_end, start)
          assert end >= 0, 'Portrait markup end not found'
          end += len(old_end)
          updated = '<img width="720" height="930" alt="Md. Amber Ali Khandoker in a black suit" src="data:image/avif;base64,' + encoded + '">'
          html = html[:start] + updated + html[end:]
          assert html.count('aspect-ratio:320/413') == 1, 'Portrait frame ratio not found'
          html = html.replace('aspect-ratio:320/413', 'aspect-ratio:720/930', 1)
          page.write_text(html)
          Path('.github/workflows/portrait-refresh.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u -- .github/workflows/portrait-refresh.yml
          git commit -m "Use higher-resolution portrait"
          git push origin HEAD:main
